<!DOCTYPE html>
<html>
<head>
    <title>AWS Virtual Classroom</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container{
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1{
            color: #232f3e;
        }

        p{
            font-size: 18px;
        }

        a{
            text-decoration: none;
        }

        button{
            background-color: #ff9900;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover{
            background-color: #e68a00;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AWS Virtual Classroom</h1>

        <p>
            Welcome to the AWS Hosted Virtual Classroom Platform.
        </p>

        <p>
            Register or Login to access course materials.
        </p>

        <a href="/register">
            <button>Register</button>
        </a>

        <a href="/login">
            <button>Login</button>
        </a>

    </div>

</body>
</html>
